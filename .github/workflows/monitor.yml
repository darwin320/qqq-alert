name: monitor

on:
  # Every 30 minutes, weekdays. Cron here is UTC. 11-23 covers pre-market from
  # about 07:00 ET, the whole cash session, and after-hours, in both EDT and
  # EST. Pre-market matters: that is where the overnight gap forms, and the
  # point of this bot is to see it forming instead of at 09:30.
  # Winter edge: after-hours runs to 20:00 EST = 01:00 UTC, so the last hour
  # is not covered between November and March.
  # GitHub schedules are best effort and can be delayed under load.
  schedule:
    - cron: '*/30 11-23 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print only, do not notify'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check prices
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SYMBOLS: ${{ vars.SYMBOLS || 'QQQ' }}
          DAILY_DROP: ${{ vars.DAILY_DROP || '2.0' }}
          DRAWDOWN: ${{ vars.DRAWDOWN || '8.0' }}
          PEAK_DAYS: ${{ vars.PEAK_DAYS || '60' }}
          EXTENDED: ${{ vars.EXTENDED || '1' }}
        run: python monitor.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Persist alert state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          git diff --staged --quiet || git commit -m 'chore: update alert state'
          git push
